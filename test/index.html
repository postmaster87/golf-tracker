<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>golf-tracker tests</title>
    <link rel="stylesheet" href="../css/themes.css" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      h1 { font-size: 18px; margin: 0 0 12px; }
      #summary { padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; font-weight: 700; }
      .ok { background: var(--accent-soft); color: var(--ink); }
      .fail { background: var(--bad); color: #fff; }
      h2 { font-size: 14px; margin: 18px 0 6px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
      li { list-style: none; margin: 2px 0; }
      ul { margin: 0; padding: 0; }
      .pass::before { content: 'PASS  '; color: var(--good); font-weight: 700; }
      .failed::before { content: 'FAIL  '; color: var(--bad); font-weight: 700; }
      .failed { color: var(--bad); }
      .err { display: block; padding-left: 6ch; color: var(--bad); }
    </style>
  </head>
  <body>
    <h1>golf-tracker — test run</h1>
    <div id="summary">running…</div>
    <div id="out"></div>
    <script type="module">
      import { getResults, runContrastTests } from './run.js';

      await runContrastTests();
      const results = getResults();
      const failed = results.filter((r) => !r.ok);

      const summary = document.getElementById('summary');
      summary.textContent = `${results.length - failed.length} / ${results.length} passing` +
        (failed.length ? ` — ${failed.length} FAILING` : ' — all green');
      summary.className = failed.length ? 'fail' : 'ok';

      const out = document.getElementById('out');
      let group = null;
      let ul = null;
      for (const r of results) {
        if (r.group !== group) {
          group = r.group;
          const h = document.createElement('h2');
          h.textContent = group;
          out.appendChild(h);
          ul = document.createElement('ul');
          out.appendChild(ul);
        }
        const li = document.createElement('li');
        li.className = r.ok ? 'pass' : 'failed';
        li.textContent = r.name;
        if (!r.ok) {
          const e = document.createElement('span');
          e.className = 'err';
          e.textContent = r.error;
          li.appendChild(e);
        }
        ul.appendChild(li);
      }
      // Machine-readable line for the harness driving this page.
      console.log(`TEST_SUMMARY ${results.length - failed.length}/${results.length} failed=${failed.length}`);
      for (const f of failed) console.error(`TEST_FAIL [${f.group}] ${f.name}: ${f.error}`);
      document.title = failed.length ? `${failed.length} FAILING` : 'all green';
    </script>
  </body>
</html>
