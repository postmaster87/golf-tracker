# Expected values for coverage-fixture.csv, worked by hand on 2026-09-13.
# Held by both implementations of the measure:
#   android/bakeoff/app/src/test/java/.../CoverageTest.kt   (the phone)
#   tools/track-coverage.py --self-test                     (the PC verdict)
#
# Rows are deliberately out of order. Sorted fix times, ms after 1700000000000:
#   0, 1000, 2000, 22000, 42001, 43001, 43001, 103001, 104001
# Intervals:
#   1000, 1000, 20000 (exactly 20 s: covered, not a gap), 20001 (gap),
#   1000, 0 (a repeated time), 60000 (gap), 1000
# covered = 1000 + 1000 + 20000 + 1000 + 0 + 1000 = 24000
# covered_pct = 24000 / 104001 * 100 = 23.0767
# Median of 9 accuracies (2.9 3.0 3.0 3.1 3.1 3.2 4.0 5.5 7.0) = 3.1
# Two rows are rejected: a fix_ms that is not a number, and a row cut short
# the way a process killed mid-write leaves one.
fixes=9
skipped=2
span_ms=104001
covered_ms=24000
gaps_over_20s=2
longest_gap_ms=60000
median_acc_m=3.1
covered_pct=23.0767
passes=false
